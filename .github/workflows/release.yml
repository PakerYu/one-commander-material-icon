name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build the pack and publish the zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer and zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq inkscape imagemagick zip

      - name: Check the license notices
        run: make notices

      - name: Build
        run: make build

      - name: Verify
        run: make verify

      - name: Package
        run: make dist

      - name: Verify the release assets
        run: |
          set -euo pipefail
          ./scripts/check-notices.sh --zip dist/*.zip
          cd dist && sha256sum -c SHA256SUMS

      - name: Read version
        id: meta
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "upstream=$(python3 -c "import json;print(json.load(open('upstream.lock.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: MaterialIconTheme ${{ steps.meta.outputs.version }} (upstream ${{ steps.meta.outputs.upstream }})
          generate_release_notes: true
          files: |
            dist/MaterialIconTheme-*.zip
            dist/SHA256SUMS
            dist/pack.json
            LICENSE
            ATTRIBUTION.md
            LICENSES/material-icon-theme-MIT.txt
          fail_on_unmatched_files: true
